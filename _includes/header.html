{%- assign is_home = false -%}
{%- if page.url == '/' -%}{%- assign is_home = true -%}{%- endif -%}
{%- assign is_post = false -%}
{%- if page.collection == 'posts' -%}{%- assign is_post = true -%}{%- endif -%}
<header class="site-header">
  <div class="header-inner">
    <a class="brand" rel="author" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">{{ site.title | escape }}</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}"{% if is_home or is_post %} class="is-active" aria-current="page"{% endif %}>文章</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} class="is-active" aria-current="page"{% endif %}>标签</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="https://github.com/{{ site.github_username }}" rel="me noopener" target="_blank">GitHub</a>
    </nav>
  </div>
</header>
