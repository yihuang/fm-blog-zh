<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-about">
      <p class="footer-brand">{{ site.title | escape }}</p>
      <p class="footer-desc">{{ site.description | strip_newlines }}</p>
    </div>
    <nav class="footer-links" aria-label="页脚导航">
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="https://github.com/{{ site.github_username }}" rel="noopener" target="_blank">GitHub</a>
      <a href="https://jekyllrb.com/" rel="noopener" target="_blank">Jekyll</a>
      <a href="#top">回到顶部 <span aria-hidden="true">↑</span></a>
    </nav>
    <p class="footer-copy">© {{ 'now' | date: '%Y' }} {{ site.title | escape }}</p>
  </div>
</footer>
