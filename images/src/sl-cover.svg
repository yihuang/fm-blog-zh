<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 900 500" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7468"/></marker></defs><rect width="900" height="500" fill="#FBF7F0"/><text x="60.0" y="54.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="700" fill="#3D5A80" text-anchor="start" letter-spacing="2.6">形式化笔记 · 程序逻辑</text><text x="60.0" y="164.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="64" font-weight="700" fill="#23272E" text-anchor="start">分离逻辑</text><text x="60.0" y="234.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="42" font-weight="700" fill="#23272E" text-anchor="start">把世界切成两半</text><path d="M 60.0 262.0 L 330.0 262.0" fill="none" stroke="#3D5A80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60.0" y="300.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#7A7468" text-anchor="start">∧ 共享一个堆，∗ 把它切开</text><text x="60.0" y="328.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#7A7468" text-anchor="start">不相交，就不相扰</text><text x="60.0" y="356.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#7A7468" text-anchor="start">剩下的，交给不变式与幽灵状态</text><text x="60.0" y="436.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="normal" fill="#7A7468" text-anchor="start">从 Reynolds 的 ∗ 到 Iris 与 iris-lean</text><text x="60.0" y="462.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal