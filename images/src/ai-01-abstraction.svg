text x="40.0" y="444.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="normal" fill="#23272E" text-anchor="start">抽象只能变大：Σ ⊆ γ(α(Σ))。α 取最小上界，γ 把抽象元素解释回具体集合。</text></svg>