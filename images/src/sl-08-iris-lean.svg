<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 900 540" text-rendering="geometricPrecision"><defs></defs><rect width="900" height="540" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">08 · iris-lean</text><text x="40.0" y="82.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#23272E" text-anchor="start">同一套结构，换一个证明助手</text><text x="40.0" y="114.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#7A7468" text-anchor="start">从 Rocq 的 Ltac 与 canonical structures，到 Lean 4 的宏与 typeclass</text><rect x="40.0" y="460.0" width="520.0" height="36.0" rx="9" fill="#F2EDE3" stroke="#7A7468" stroke-width="1.3"/><text x="56.0" y="483.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="700" fill="#7A7468" text-anchor="start">Lean 4 + Mathlib</text><text x="306.0" y="483.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#7A7468" text-anchor="start">内核、宏、simp、代数与概率</text><rect x="40.0" y="418.0" width="520.0" height="36.0" rx="9" fill="#EAF1EC" stroke="#2F7D6B" stroke-width="1.3"/><text x="56.0" y="441.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="700" fill="#2F7D6B" text-anchor="start">COFE / OFE / camera</text><text x="306.0" y="441.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#7A7468" text-anchor="start">商类型 + Leibniz 相等</text><rect x="40.0" y="376.0" width="520.0" height="36.0" rx="9" fill="#E9F0F6" stroke="#2C4257" stroke-width="1.3"/><text x="56.0" y="399.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="700" fill="#2C4257" text-anchor="start">IProp GF</text><text x="306.0" y="399.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#7A7468" text-anchor="start">步进索引；GF 是资源代数的槽</text><rect x="40.0" y="334.0" width="520.0" height="36.0" rx="9" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.3"/><text x="56.0" y="357.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="700" fill="#3D5A80" text-anchor="start">WP + 不变式 + later credits</text><text x="306.0" y="357.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#7A7468" text-anchor="start">由 wp.pre 的不动点定义</text><rect x="40.0" y="292.0" width="520.0" height="36.0" rx="9" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.3"/><text x="56.0" y="315.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="700" fill="#3D5A80" text-anchor="start">HeapLang 与规则</text><text x="306.0" y="315.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#7A7468" text-anchor="start">hl(λ x, ...)，wp_load、wp_cmpxchg</text><rect x="40.0" y="250.0" width="520.0" height="36.0" rx="9" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.3"/><text x="56.0" y="273.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="700" fill="#3D5A80" text-anchor="start">MoSeL 证明模式</text><text x="306.0" y="273.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#7A7468" text-anchor="start">对任意 BI 都成立的证明搜索</text><rect x="40.0" y="208.0" width="520.0" height="36.0" rx="9" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.3"/><text x="56.0" y="231.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="700" fill="#BF4A32" text-anchor="start">你的证明</text><text x="306.0" y="231.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#7A7468" text-anchor="start">iintro / iinv / wp_load / imod</text><text x="600.0" y="176.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="600" fill="#7A7468" text-anchor="start">换到 Lean 之后的三处改动</text><rect x="590.0" y="198.0" width="270.0" height="76.0" rx="10" fill="#FFFCF7" stroke="#D8CFBF" stroke-width="1.1"/><text x="606.0" y="222.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="700" fill="#BF4A32" text-anchor="start">Leibniz OFE</text><text x="606.0" y="244.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#23272E" text-anchor="start">OFE 里没有 dist / equiv，</text><text x="606.0" y="262.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#7A7468" text-anchor="start">非 Leibniz 的用商类型</text><rect x="590.0" y="290.0" width="270.0" height="76.0" rx="10" fill="#FFFCF7" stroke="#D8CFBF" stroke-width="1.1"/><text x="606.0" y="314.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="700" fill="#BF4A32" text-anchor="start">集合式量化</text><text x="606.0" y="336.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#23272E" text-anchor="start">sForall : (PROP → Prop) → PROP</text><text x="606.0" y="354.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#7A7468" text-anchor="start">绕开宇宙不一致</text><rect x="590.0" y="382.0" width="270.0" height="76.0" rx="10" fill="#FFFCF7" stroke="#D8CFBF" stroke-width="1.1"/><text x="606.0" y="406.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="700" fill="#BF4A32" text-anchor="start">typeclass</text><text x="606.0" y="428.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#23272E" text-anchor="start">取代 canonical structures</text><text x="606.0" y="446.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#7A7468" text-anchor="start">合成行为仍在打磨</text><text x="600.0" y="486.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">十万行 Lean，从一篇硕士论文长出来</text></svg>