<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 900 570" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7468"/></marker></defs><rect width="900" height="570" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">07 · 最弱前置条件</text><text x="40.0" y="82.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#23272E" text-anchor="start">WP 是被定义出来的</text><text x="40.0" y="114.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#7A7468" text-anchor="start">一个守卫递归的不动点，而不是一组公理</text><rect x="340.0" y="150.0" width="220.0" height="54.0" rx="10" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.4"/><text x="450.0" y="182.4" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="#2C4257" text-anchor="middle">WP e  {{ Φ }}</text><path d="M 450.0 212.0 Q 450.0 227.0 450.0 246.0" fill="none" stroke="#7A7468" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m0)"/><text x="462.0" y="234.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.075" font-weight="normal" fill="#7A7468" text-anchor="start">按 e 是不是值分两支</text><rect x="40.0" y="256.0" width="380.0" height="186.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="58.0" y="282.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="600" fill="#7A7468" text-anchor="start">e 是值 v</text><rect x="66.0" y="300.0" width="328.0" height="48.0" rx="10" fill="#FFFCF7" stroke="#2F7D6B" stroke-width="1.4"/><text x="230.0" y="328.7" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#2F7D6B" text-anchor="middle">|={E}=&gt; Φ v</text><text x="58.0" y="382.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">没有步可走：直接把后置条件交出来</text><text x="58.0" y="404.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">（视图更新允许先做一次幽灵改写）</text><rect x="480.0" y="256.0" width="380.0" height="186.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="498.0" y="282.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="600" fill="#7A7468" text-anchor="start">e 不是值</text><text x="496.0" y="306.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#23272E" text-anchor="start">∀ σ, stateInterp σ ={E,∅}=∗</text><text x="496.0" y="326.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#23272E" text-anchor="start">⌜可归约⌝ ∗ ∀ e′ σ′, ⌜(e,σ) → (e′,σ′)⌝ -∗</text><text x="496.0" y="346.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="normal" fill="#BF4A32" text-anchor="start">£ (n+1) ={∅}▷=∗ WP e′ {{Φ}}</text><text x="498.0" y="380.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">先证明它不会卡住，再对每一步递归</text><text x="498.0" y="402.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">▷ 把递归挡在下一步之后</text><rect x="40.0" y="466.0" width="820.0" height="74.0" rx="14" fill="#F6F1E7" stroke="#E4D9C6" stroke-width="1.2"/><text x="60.0" y="494.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#23272E" text-anchor="start">adequacy：若 ⊢ WP e {{ v. ⌜φ v⌝ }}，则 e 从空堆出发永不卡住，</text><text x="60.0" y="522.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#23272E" text-anchor="start">且任何终值 v 都满足 φ。这条定理把逻辑接回操作语义。</text></svg>