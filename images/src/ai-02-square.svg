<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 900 540" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3D5A80"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BF4A32"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3D5A80"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3D5A80"/></marker></defs><rect width="900" height="540" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">02 · 健全性</text><text x="40.0" y="82.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#23272E" text-anchor="start">局部健全，全局健全</text><text x="40.0" y="114.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#7A7468" text-anchor="start">每条语句都盖住，整个程序就盖住</text><text x="205.0" y="160.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="normal" fill="#7A7468" text-anchor="middle">具体：状态集合</text><text x="675.0" y="160.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="normal" fill="#7A7468" text-anchor="middle">抽象：摘要</text><rect x="110.0" y="180.0" width="190.0" height="52.0" rx="10" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.4"/><text x="205.0" y="212.8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#2C4257" text-anchor="middle">Σ</text><rect x="110.0" y="340.0" width="190.0" height="52.0" rx="10" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.4"/><text x="205.0" y="372.8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#2C4257" text-anchor="middle">f(Σ)</text><rect x="560.0" y="180.0" width="230.0" height="52.0" rx="10" fill="#FFFCF7" stroke="#BF4A32" stroke-width="1.4"/><text x="675.0" y="212.8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#BF4A32" text-anchor="middle">α(Σ)</text><rect x="560.0" y="340.0" width="230.0" height="52.0" rx="10" fill="#FFFCF7" stroke="#BF4A32" stroke-width="1.4"/><text x="675.0" y="372.8" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="600" fill="#BF4A32" text-anchor="middle">f#(α(Σ))</text><path d="M 205.0 232.0 Q 205.0 285.0 205.0 334.0" fill="none" stroke="#3D5A80" stroke-width="2" stroke-linecap="round" marker-end="url(#m0)"/><text x="186.0" y="292.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#3D5A80" text-anchor="end">f</text><path d="M 675.0 232.0 Q 675.0 285.0 675.0 334.0" fill="none" stroke="#BF4A32" stroke-width="2" stroke-linecap="round" marker-end="url(#m1)"/><text x="694.0" y="292.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#BF4A32" text-anchor="start">f#</text><path d="M 306.0 206.0 Q 429.0 206.0 556.0 206.0" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m2)"/><text x="430.0" y="194.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#3D5A80" text-anchor="middle">α</text><path d="M 306.0 368.0 Q 429.0 368.0 556.0 368.0" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m3)"/><text x="430.0" y="356.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#3D5A80" text-anchor="middle">α</text><rect x="40.0" y="414.0" width="820.0" height="104.0" rx="14" fill="#F6F1E7" stroke="#E4D9C6" stroke-width="1.2"/><text x="60.0" y="442.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="700" fill="#7A7468" text-anchor="start" letter-spacing="2">从局部到全局</text><text x="60.0" y="470.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="normal" fill="#2F7D6B" text-anchor="start">局部健全：α(f(Σ)) ⊑ f#(α(Σ))，每条语句的抽象转移都盖住具体转移。</text><text x="60.0" y="498.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="normal" fill="#23272E" text-anchor="start">归纳：若 Σ_n ⊆ γ(a_n)，则 f(Σ_n) ⊆ γ(f#(a_n))；取并之后，仍然覆盖。</text></svg>