 242.5 284.1 253.3 297.2 C 264.2 310.2 280.1 326.0 280.9 342.0 C 281.8 358.0 269.4 382.1 258.6 393.1 C 247.8 404.0 231.0 406.7 216.0 407.7 C 201.0 408.7 177.7 410.0 168.5 399.0 C 159.3 388.1 160.1 360.0 160.9 342.0 C 161.8 324.0 164.5 304.3 173.7 291.3 C 182.9 278.2 202.7 262.7 216.0 263.7 Z" fill="none" stroke="#2F7D6B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="216.0" y="348.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="700" fill="#2F7D6B" text-anchor="middle">f 的原像</text><path d="M 398.0 306.0 Q 453.0 290.0 508.0 306.0" fill="none" stroke="#23272E" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m0)"/><text x="452.0" y="276.0" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="22" font-weight="normal" fill="#23272E" text-anchor="middle" font-style="italic">f</text><circle cx="292.0" cy="348.0" r="6.0" fill="#BF4A32" stroke="#FBF7F0" stroke-width="1.4"/><text x="292.0" y="378.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#BF4A32" text-anchor="middle">x</text><circle cx="722.0" cy="278.0" r="6.0" fill="#BF4A32" stroke="#FBF7F0" stroke-width="1.4"/><text x="778.0" y="300.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#BF4A32" text-anchor="start">f(x)</text><path d="M 300.0 344.0 Q 502.3 288.3 712.0 284.0" fill="none" stroke="#BF4A32" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.75" marker-end="url(#m1)"/><text x="40.0" y="486.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#23272E" text-anchor="start">要确认“f(x) ∈ U”，只要确认“x 落在 f 的原像里”。</text><text x="40.0" y="518.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.2" font-weight="normal" fill="#7A7468" text-anchor="start">连续性保证原像是开集：一次有限观察就能确认 —— 输出的每个观察都能被回答。</text><text x="40.0" y="550.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.179999999999998" font-weight="normal" fill="#7A7468" text-anchor="start">在度量空间里，这句话就是 ε-δ：∀ ε &gt; 0, ∃ δ &gt; 0, dist x y &lt; δ ⟹ dist (f x) (f y) &lt; ε。</text></svg>