<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 900 580" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23272E"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BF4A32"/></marker></defs><rect width="900" height="580" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">图 5 / CONTINUITY</text><text x="40.0" y="78.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#23272E" text-anchor="start">连续：输出的每个观察，都能用输入的有限观察回答</text><text x="40.0" y="110.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17.5" font-weight="normal" fill="#7A7468" text-anchor="start">f 连续，当且仅当每个开集 U 的原像也是开集</text><path d="M 226.0 204.8 C 255.3 207.1 283.5 222.3 308.1 236.6 C 332.7 250.8 362.2 268.1 373.4 290.4 C 384.6 312.7 386.3 347.9 375.5 370.2 C 364.7 392.4 333.5 410.2 308.6 424.0 C 283.7 437.8 255.5 450.6 226.0 452.8 C 196.5 455.1 154.7 451.5 131.8 437.2 C 108.8 422.9 95.0 391.0 88.1 367.0 C 81.2 343.1 82.9 317.5 90.2 293.5 C 97.6 269.6 109.6 238.1 132.3 223.4 C 154.9 208.6 196.7 202.6 226.0 204.8 Z" fill="none" stroke="#23272E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="226.0" y="180.0" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="24" font-weight="700" fill="#23272E" text-anchor="middle">X</text><path d="M 668.0 197.8 C 696.8 197.1 734.1 213.5 756.3 229.6 C 778.4 245.7 791.1 270.9 801.1 294.2 C 811.1 317.6 823.3 346.5 816.4 369.9 C 809.5 393.2 784.6 421.9 759.9 434.