<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="940" viewBox="0 0 900 470" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7468"/></marker></defs><rect width="900" height="470" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">03 · 局部性</text><text x="40.0" y="82.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#23272E" text-anchor="start">机器是局部的，框架规则才成立</text><text x="40.0" y="114.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#7A7468" text-anchor="start">在更大的堆里跑，结果 = 原来的结果 + 原封不动的 R</text><text x="96.0" y="200.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="end">h</text><text x="120.0" y="156.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="1.6">① 小堆里跑</text><rect x="120.0" y="170.0" width="86.0" height="46.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="163.0" y="197.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#2C4257" text-anchor="middle">x ↦ 0</text><rect x="212.0" y="170.0" width="86.0" height="46.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="255.0" y="197.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#2C4257" text-anchor="middle">y ↦ 1</text><text x="330.0" y="200.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="normal" fill="#7A7468" text-anchor="start">→*  e′</text><path d="M 150.0 230.0 Q 150.0 247.0 150.0 268.0" fill="none" stroke="#7A7468" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m0)"/><text x="164.0" y="252.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">同一段代码</text><text x="96.0" y="344.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="end">h + R</text><text x="120.0" y="300.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="1.6">② 大堆里跑</text><rect x="120.0" y="314.0" width="86.0" height="46.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="163.0" y="341.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#2C4257" text-anchor="middle">x ↦ 0</text><rect x="212.0" y="314.0" width="86.0" height="46.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="255.0" y="341.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#2C4257" text-anchor="middle">y ↦ 1</text><rect x="322.0" y="302.0" width="386.0" height="82.0" rx="10" fill="none" stroke="#BF4A32" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="340.0" y="312.0" width="62.0" height="44.0" rx="8" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.5"/><text x="371.0" y="338.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#8E3324" text-anchor="middle">?</text><rect x="414.0" y="312.0" width="62.0" height="44.0" rx="8" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.5"/><text x="445.0" y="338.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#8E3324" text-anchor="middle">?</text><rect x="488.0" y="312.0" width="62.0" height="44.0" rx="8" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.5"/><text x="519.0" y="338.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#8E3324" text-anchor="middle">?</text><text x="515.0" y="376.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="normal" fill="#BF4A32" text-anchor="middle">R：一个字节都没变</text><text x="726.0" y="344.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.374999999999998" font-weight="normal" fill="#7A7468" text-anchor="start">→*  e′ + R</text><rect x="40.0" y="400.0" width="820.0" height="50.0" rx="14" fill="#F6F1E7" stroke="#E4D9C6" stroke-width="1.2"/><text x="60.0" y="431.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="normal" fill="#23272E" text-anchor="start">这就是“局部”：程序只看得见自己的 footprint，容器变大不改变它的行为。</text></svg>