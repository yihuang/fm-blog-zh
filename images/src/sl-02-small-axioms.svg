<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 900 540" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3D5A80"/></marker></defs><rect width="900" height="540" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">02 · 小公理与框架规则</text><text x="40.0" y="82.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#23272E" text-anchor="start">只说自己碰过的那几个格子</text><text x="40.0" y="114.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#7A7468" text-anchor="start">剩下的世界，交给一条规则统一处理</text><text x="240.0" y="158.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="700" fill="#7A7468" text-anchor="middle" letter-spacing="2">小公理</text><rect x="70.0" y="180.0" width="340.0" height="54.0" rx="10" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.4"/><text x="240.0" y="211.5" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="600" fill="#2C4257" text-anchor="middle">{x ↦ _}  x := v  {x ↦ v}</text><text x="240.0" y="258.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="middle">恰好一个格子：不多说一个字</text><rect x="208.0" y="282.0" width="64.0" height="42.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5" stroke-dasharray="5 4"/><text x="240.0" y="307.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#2C4257" text-anchor="middle">_</text><path d="M 410.0 296.0 Q 445.0 296.0 480.0 296.0" fill="none" stroke="#3D5A80" stroke-width="2.2" stroke-linecap="round" marker-end="url(#m0)"/><text x="445.0" y="282.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="700" fill="#3D5A80" text-anchor="middle">框住</text><text x="445.0" y="318.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="normal" fill="#3D5A80" text-anchor="middle">R</text><text x="660.0" y="158.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="700" fill="#7A7468" text-anchor="middle" letter-spacing="2">框住的版本</text><rect x="500.0" y="180.0" width="360.0" height="54.0" rx="10" fill="#FFFCF7" stroke="#BF4A32" stroke-width="1.4"/><text x="680.0" y="211.3" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="600" fill="#BF4A32" text-anchor="middle">{x ↦ _ ∗ R} x := v {x ↦ v ∗ R}</text><text x="682.0" y="258.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="middle">R 的格子：一个字都不许动</text><rect x="538.0" y="282.0" width="64.0" height="42.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="570.0" y="307.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#2C4257" text-anchor="middle">_</text><rect x="628.0" y="282.0" width="56.0" height="42.0" rx="8" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.5"/><text x="656.0" y="307.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#8E3324" text-anchor="middle">?</text><rect x="694.0" y="282.0" width="56.0" height="42.0" rx="8" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.5"/><text x="722.0" y="307.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#8E3324" text-anchor="middle">?</text><rect x="760.0" y="282.0" width="56.0" height="42.0" rx="8" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.5"/><text x="788.0" y="307.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#8E3324" text-anchor="middle">?</text><rect x="40.0" y="372.0" width="820.0" height="148.0" rx="14" fill="#F6F1E7" stroke="#E4D9C6" stroke-width="1.2"/><text x="60.0" y="400.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="700" fill="#7A7468" text-anchor="start" letter-spacing="2">框架规则（frame rule）</text><text x="64.0" y="434.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="normal" fill="#23272E" text-anchor="start">{P}  c  {Q}</text><text x="300.0" y="434.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">前提：c 不改 R 里出现的程序变量</text><path d="M 64.0 450.0 L 420.0 450.0" fill="none" stroke="#23272E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="64.0" y="482.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="normal" fill="#BF4A32" text-anchor="start">{P ∗ R}  c  {Q ∗ R}</text><text x="300.0" y="482.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">R 原样挂在两边，不需要额外证明</text><text x="64.0" y="508.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">一条规则，替代了每个规格里那句“其余不变”。</text></svg>