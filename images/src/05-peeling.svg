<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 900 540" text-rendering="geometricPrecision"><defs><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BF4A32"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7468"/></marker></defs><rect width="900" height="540" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">图 5 / ATTRACTOR</text><text x="40.0" y="78.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#23272E" text-anchor="start">点亮：从目标倒着长</text><text x="40.0" y="110.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#7A7468" text-anchor="start">同一张锁状态图：只有 G 被点亮</text><rect x="95.0" y="210.0" width="360.0" height="150.0" rx="26" fill="#BF4A32" stroke="none" stroke-width="1" opacity="0.05"/><rect x="95.0" y="210.0" width="360.0" height="150.0" rx="26" fill="none" stroke="#BF4A32" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.45"/><text x="275.0" y="190.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#BF4A32" text-anchor="middle">点不亮：坏环</text><path d="M 188.0 280.0 Q 270.0 280.0 352.0 280.0" fill="none" stroke="#BF4A32" stroke-width="2.3" stroke-linecap="round" marker-end="url(#ar-red)"/><path d="M 356.2 262.6 Q 270.0 218.0 183.8 262.6" fill="none" stroke="#BF4A32" stroke-width="2.3" stroke-linecap="round" marker-end="url(#ar-red)"/><path d="M 428.0 280.0 Q 520.0 280.0 612.0 280.0" fill="none" stroke="#7A7468" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#ar-muted)"/><text x="520.0" y="252.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="normal" fill="#7A7468" text-anchor="middle">这条路存在，但不是所有路</text><circle cx="150.0" cy="280.0" r="38.0" fill="#BF4A32" stroke="#8E3324" stroke-width="2.4"/><text x="150.0" y="286.3" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">S</text><circle cx="179.6" cy="250.4" r="10.5" fill="#FBF7F0" stroke="#8E3324" stroke-width="1.4"/><text x="179.6" y="254.4" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="600" fill="#8E3324" text-anchor="middle">∞</text><circle cx="390.0" cy="280.0" r="38.0" fill="#BF4A32" stroke="#8E3324" stroke-width="2.4"/><text x="390.0" y="286.3" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">R</text><circle cx="419.6" cy="250.4" r="10.5" fill="#FBF7F0" stroke="#8E3324" stroke-width="1.4"/><text x="419.6" y="254.4" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="600" fill="#8E3324" text-anchor="middle">∞</text><circle cx="650.0" cy="280.0" r="38.0" fill="#2F7D6B" stroke="#2F7D6B" stroke-width="2.4"/><text x="650.0" y="286.3" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">G</text><circle cx="680.0" cy="250.0" r="10.5" fill="#FBF7F0" stroke="#2F7D6B" stroke-width="1.4"/><text x="680.0" y="254.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="600" fill="#2F7D6B" text-anchor="middle">0</text><text x="150.0" y="344.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="normal" fill="#7A7468" text-anchor="middle">T1 持锁 / T2 等</text><text x="390.0" y="344.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="normal" fill="#7A7468" text-anchor="middle">锁空闲</text><text x="650.0" y="344.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="normal" fill="#7A7468" text-anchor="middle">T2 持锁</text><text x="80.0" y="430.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="normal" fill="#7A7468" text-anchor="start">先点亮 G（0 步）。只有“所有后继都亮了”的点才会亮。</text><text x="80.0" y="456.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="normal" fill="#7A7468" text-anchor="start">R 有一条边回到 S，S 又回到 R；所以 S、R 都停在 ∞。</text><text x="80.0" y="500.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.5" font-weight="normal" fill="#7A7468" text-anchor="start" letter-spacing="1">0 = 目标    ∞ = 点不亮</text></svg>