<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 900 560" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BF4A32"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3D5A80"/></marker></defs><rect width="900" height="560" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">06 · 不变式与 later</text><text x="40.0" y="82.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#23272E" text-anchor="start">把资源借出去，只准原子地拿回来</text><text x="40.0" y="114.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#7A7468" text-anchor="start">inv N P：一个永远成立的盒子，打开要付一次视图更新</text><rect x="330.0" y="158.0" width="240.0" height="112.0" rx="14" fill="#FFFCF7" stroke="#3D5A80" stroke-width="2"/><text x="450.0" y="194.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#2C4257" text-anchor="middle">inv N P</text><text x="450.0" y="220.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="middle">永远成立；不属于任何人</text><text x="450.0" y="242.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="middle">□ 可复制，任意线程都能拿</text><path d="M 318.0 200.0 Q 274.0 200.0 232.0 200.0" fill="none" stroke="#BF4A32" stroke-width="1.9" stroke-linecap="round" marker-end="url(#m0)"/><text x="272.0" y="186.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.075" font-weight="normal" fill="#BF4A32" text-anchor="middle">|={E, E∖N}=&gt;</text><rect x="96.0" y="176.0" width="116.0" height="48.0" rx="10" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.5"/><text x="154.0" y="206.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#8E3324" text-anchor="middle">▷ P</text><text x="96.0" y="250.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#BF4A32" text-anchor="start">取出来的只是 ▷P</text><path d="M 232.0 300.0 Q 274.0 300.0 318.0 300.0" fill="none" stroke="#3D5A80" stroke-width="1.9" stroke-linecap="round" marker-end="url(#m1)"/><text x="272.0" y="330.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.075" font-weight="normal" fill="#3D5A80" text-anchor="middle">|={E∖N, E}=&gt;</text><text x="96.0" y="330.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#3D5A80" text-anchor="start">原样还回去</text><text x="96.0" y="350.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#3D5A80" text-anchor="start">才关得上盒子</text><text x="660.0" y="176.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="600" fill="#7A7468" text-anchor="start">为什么要晚一步</text><text x="660.0" y="206.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">第 n 步</text><rect x="724.0" y="190.0" width="110.0" height="32.0" rx="7" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.2"/><text x="779.0" y="211.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="normal" fill="#2C4257" text-anchor="middle">P</text><text x="660.0" y="252.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">第 n+1 步</text><rect x="724.0" y="236.0" width="110.0" height="32.0" rx="7" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.2"/><text x="779.0" y="257.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="normal" fill="#8E3324" text-anchor="middle">▷ P</text><path d="M 724.0 222.0 L 724.0 236.0" fill="none" stroke="#7A7468" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="660.0" y="300.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">P 可以再次提到 inv N P 自己，</text><text x="660.0" y="320.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">所以打开后拿到的只能是“下一步的 P”，</text><text x="660.0" y="340.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">否则这个定义不是良基的不动点。</text><rect x="40.0" y="376.0" width="820.0" height="74.0" rx="14" fill="#F6F1E7" stroke="#E4D9C6" stroke-width="1.2"/><text x="60.0" y="404.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#23272E" text-anchor="start">打开：把 P 拿出来用；关闭：原样放回去。这在别的线程看来是原子的——</text><text x="60.0" y="432.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#23272E" text-anchor="start">中间状态没人看得见，掩码 E∖N 保证你自己也不能重入。</text><rect x="40.0" y="466.0" width="820.0" height="46.0" rx="12" fill="#FFFCF7" stroke="#D8CFBF" stroke-width="1.1"/><text x="60.0" y="495.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">每一步发一张 £（later credit），开一次盒子花一张：账目对得上，循环就骗不了它。</text></svg>