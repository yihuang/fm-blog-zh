<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 900 500" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7468"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7468"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7468"/></marker><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7468"/></marker></defs><rect width="900" height="500" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">05 · 精度</text><text x="40.0" y="82.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#23272E" text-anchor="start">精度从哪里漏掉</text><text x="40.0" y="114.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#7A7468" text-anchor="start">合并丢相关性，域丢形状，widening 丢上界</text><rect x="40.0" y="140.0" width="380.0" height="280.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><rect x="480.0" y="140.0" width="380.0" height="280.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="58.0" y="168.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start">① 路径合并</text><text x="498.0" y="168.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start">② 相关性</text><rect x="70.0" y="200.0" width="96.0" height="44.0" rx="10" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.4"/><text x="118.0" y="227.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#2C4257" text-anchor="middle">x = 1</text><rect x="70.0" y="292.0" width="96.0" height="44.0" rx="10" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.4"/><text x="118.0" y="319.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#2C4257" text-anchor="middle">x = 2</text><rect x="286.0" y="246.0" width="116.0" height="44.0" rx="10" fill="#FFFCF7" stroke="#BF4A32" stroke-width="1.4"/><text x="344.0" y="272.7" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#BF4A32" text-anchor="middle">x ∈ [1,2]</text><path d="M 170.0 222.0 Q 229.8 224.5 278.5 252.0" fill="none" stroke="#7A7468" stroke-width="1.6" stroke-linecap="round" marker-end="url(#m0)"/><path d="M 170.0 314.0 Q 229.8 311.5 278.5 284.0" fill="none" stroke="#7A7468" stroke-width="1.6" stroke-linecap="round" marker-end="url(#m1)"/><text x="250.0" y="228.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="normal" fill="#BF4A32" text-anchor="start">⊔ 合并</text><text x="70.0" y="372.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#7A7468" text-anchor="start">两个分支都到这里；摘要只记得“1 或 2”的外壳。</text><path d="M 534.0 380.0 L 702.0 380.0" fill="none" stroke="#7A7468" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 702.0 380.0 Q 708.0 380.0 714.0 380.0" fill="none" stroke="#7A7468" stroke-width="1.4" stroke-linecap="round" marker-end="url(#m2)"/><path d="M 540.0 386.0 L 540.0 218.0" fill="none" stroke="#7A7468" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 540.0 218.0 Q 540.0 212.0 540.0 206.0" fill="none" stroke="#7A7468" stroke-width="1.4" stroke-linecap="round" marker-end="url(#m3)"/><text x="706.0" y="402.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="normal" fill="#7A7468" text-anchor="middle">x</text><text x="524.0" y="214.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="normal" fill="#7A7468" text-anchor="middle">y</text><rect x="540.0" y="244.0" width="136.0" height="136.0" rx="0" fill="#F7E7E2" stroke="#BF4A32" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="540.0" cy="380.0" r="4.6" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="608.0" cy="312.0" r="4.6" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="676.0" cy="244.0" r="4.6" fill="#3D5A80" stroke="none" stroke-width="1"/><text x="622.0" y="304.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.374999999999998" font-weight="normal" fill="#3D5A80" text-anchor="start">x = y</text><circle cx="540.0" cy="244.0" r="7.0" fill="none" stroke="#BF4A32" stroke-width="2"/><text x="556.0" y="230.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="normal" fill="#BF4A32" text-anchor="start">不可达，但盒子以为可能</text><text x="498.0" y="404.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#7A7468" text-anchor="start">盒子记住了 x、y 各自的区间，却没记住它们一起变。</text><text x="40.0" y="462.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="normal" fill="#23272E" text-anchor="start">每次 join 都在回答：“这两个状态有什么共同的上界？”答案总是比真相更宽。</text></svg>