<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 900 540" text-rendering="geometricPrecision"><defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23272E"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BF4A32"/></marker></defs><rect width="900" height="540" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">图 3 / LASSO</text><text x="40.0" y="78.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#23272E" text-anchor="start">反例的形状：一个环</text><text x="40.0" y="110.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#7A7468" text-anchor="start">有限图里的无限坏行为，总能写成一个环</text><path d="M 312 280 C 310 196 392 166 462 190 C 530 213 535 340 470 372 C 402 405 314 368 312 280 Z" fill="#BF4A32" stroke="#BF4A32" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" opacity="0.07"/><path d="M 312 280 C 310 196 392 166 462 190 C 530 213 535 340 470 372 C 402 405 314 368 312 280 Z" fill="none" stroke="#BF4A32" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6" opacity="0.55"/><path d="M 134.0 280.0 Q 165.0 280.0 196.0 280.0" fill="none" stroke="#23272E" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-ink)"/><path d="M 244.0 280.0 Q 280.0 280.0 316.0 280.0" fill="none" stroke="#23272E" stroke-width="2" stroke-linecap="round" marker-end="url(#ar-ink)"/><path d="M 360.5 267.5 Q 399.0 244.0 437.5 220.5" fill="none" stroke="#BF4A32" stroke-wi