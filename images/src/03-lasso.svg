one" stroke="#7A7468" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="165.0" y="388.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#7A7468" text-anchor="middle">stem：有限，可打印</text><text x="420.0" y="272.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#BF4A32" text-anchor="middle">loop</text><text x="420.0" y="292.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="normal" fill="#BF4A32" text-anchor="middle">永远重复</text><text x="80.0" y="462.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" fill="#7A7468" text-anchor="start">一条无限轨迹的有限写法</text><text x="80.0" y="494.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#23272E" text-anchor="start">σ = s₀ s₁ (s₂ s₃ s₄)^ω</text><rect x="610.0" y="140.0" width="250.0" height="380.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="632.0" y="182.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#23272E" text-anchor="start">为什么一定是环？</text><circle cx="646.0" cy="224.0" r="12.0" fill="#BF4A32" stroke="#BF4A32" stroke-width="1"/><text x="646.0" y="229.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="668.0" y="230.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#23272E" text-anchor="start">有限个状态，无限步</text><circle cx="646.0" cy="276.0" r="12.0" fill="#BF4A32" stroke="#BF4A32" stroke-width="1"/><text x="646.0" y="281.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="668.0" y="282.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#23272E" text-anchor="start">必有状态重复</text><circle cx="646.0" cy="328.0" r="12.0" fill="#BF4A32" stroke="#BF4A32" stroke-width="1"/><text x="646.0" y="333.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="668.0" y="334.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#23272E" text-anchor="start">重复的那一段，就是环</text><rect x="632.0" y="382.0" width="206.0" height="50.0" rx="10" fill="#F8E7E1" stroke="none" stroke-width="1"/><text x="735.0" y="412.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#8E3324" text-anchor="middle">反例 = 可达的坏环</text><text x="632.0" y="464.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="normal" fill="#7A7468" text-anchor="start">模型检查器找 liveness bug，</text><text x="632.0" y="484.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="normal" fill="#7A7468" text-anchor="start">本质上就是在找这个环。</text></svg>