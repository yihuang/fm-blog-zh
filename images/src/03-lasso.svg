<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 900 540" text-rendering="geometricPrecision"><defs><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BF4A32"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D6B"/></marker></defs><rect width="900" height="540" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">图 3 / LASSO</text><text x="40.0" y="78.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#23272E" text-anchor="start">反例的形状：一个环</text><text x="40.0" y="110.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="normal" fill="#7A7468" text-anchor="start">把开头的锁例子画出来：S 和 R 转来转去，G 永远到不了</text><rect x="125.0" y="210.0" width="360.0" height="150.0" rx="26" fill="#BF4A32" stroke="none" stroke-width="1" opacity="0.05"/><rect x="125.0" y="210.0" width="360.0" height="150.0" rx="26" fill="none" stroke="#BF4A32" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.45"/><text x="305.0" y="190.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#BF4A32" text-anchor="middle">坏环</text><path d="M 218.0 280.0 Q 300.0 280.0 382.0 280.0" fill="none" stroke="#BF4A32" stroke-width="2.3" stroke-linecap="round" marker-end="url(#ar-red)"/><path d="M 386.2 262.6 Q 300.0 218.0 213.8 262.6" fill="none" stroke="#BF4A32" stroke-width="2.3" stroke-linecap="round" marker-end="url(#ar-red)"/><path d="M 458.0 280.0 Q 550.0 280.0 642.0 280.0" fill="none" stroke="#2F7D6B" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#ar-green)"/><text x="300.0" y="228.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#BF4A32" text-anchor="middle">T1 又抢到</text><text x="300.0" y="305.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="normal" fill="#7A7468" text-anchor="middle">T1 释放锁</text><text x="550.0" y="252.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#2F7D6B" text-anchor="middle">T2 抢到（但没走）</text><circle cx="180.0" cy="280.0" r="38.0" fill="#FBF7F0" stroke="#BF4A32" stroke-width="2.4"/><text x="180.0" y="286.3" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#23272E" text-anchor="middle">S</text><circle cx="420.0" cy="280.0" r="38.0" fill="#FBF7F0" stroke="#BF4A32" stroke-width="2.4"/><text x="420.0" y="286.3" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#23272E" text-anchor="middle">R</text><circle cx="680.0" cy="280.0" r="38.0" fill="#2F7D6B" stroke="#2F7D6B" stroke-width="2.4"/><text x="680.0" y="286.3" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">G</text><text x="180.0" y="344.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="normal" fill="#7A7468" text-anchor="middle">T1 持锁 / T2 等</text><text x="420.0" y="344.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="normal" fill="#7A7468" text-anchor="middle">锁空闲</text><text x="680.0" y="344.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="normal" fill="#7A7468" text-anchor="middle">T2 持锁</text><text x="113.0" y="286.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="600" fill="#BF4A32" text-anchor="end">start</text><text x="80.0" y="432.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" fill="#7A7468" text-anchor="start">一条永远不到 G 的执行</text><text x="80.0" y="468.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="normal" fill="#23272E" text-anchor="start">σ = (S R)^ω</text><text x="400.0" y="468.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.5" font-weight="normal" fill="#7A7468" text-anchor="start">G 有入边；但这条执行永远不选它</text></svg>