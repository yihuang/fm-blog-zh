<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 900 500" text-rendering="geometricPrecision"><defs></defs><rect width="900" height="500" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">01 · 整块与两半</text><text x="40.0" y="82.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#23272E" text-anchor="start">∧ 共享一个堆，∗ 把它切成两半</text><text x="40.0" y="114.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#7A7468" text-anchor="start">断言不再描述“整个状态”，而是描述“状态的一块”</text><rect x="40.0" y="148.0" width="380.0" height="250.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="58.0" y="176.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="600" fill="#7A7468" text-anchor="start">逻辑与：同一个堆，两件事都成立</text><rect x="66.0" y="200.0" width="70.0" height="46.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="101.0" y="227.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2C4257" text-anchor="middle">x ↦ 0</text><rect x="150.0" y="200.0" width="70.0" height="46.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="185.0" y="227.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2C4257" text-anchor="middle">y ↦ 1</text><rect x="234.0" y="200.0" width="70.0" height="46.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="269.0" y="227.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2C4257" text-anchor="middle">z ↦ 2</text><rect x="318.0" y="200.0" width="70.0" height="46.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="353.0" y="227.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2C4257" text-anchor="middle">w ↦ 3</text><path d="M 66.0 268.0 L 394.0 268.0" fill="none" stroke="#D8CFBF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 66.0 268.0 L 66.0 276.0" fill="none" stroke="#D8CFBF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 394.0 268.0 L 394.0 276.0" fill="none" stroke="#D8CFBF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="230.0" y="296.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="600" fill="#23272E" text-anchor="middle">整个堆 h</text><text x="230.0" y="326.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="middle">P ∧ Q：两句话都必须由这同一个 h 满足</text><text x="230.0" y="348.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="middle">谁写了哪个格子？规格说不出来</text><text x="230.0" y="378.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="middle">于是每加一个格子，规格都要重写</text><rect x="480.0" y="148.0" width="380.0" height="250.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="498.0" y="176.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="600" fill="#7A7468" text-anchor="start">分离合取：堆被切成互不相交的两半</text><rect x="500.0" y="200.0" width="70.0" height="46.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="535.0" y="227.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2C4257" text-anchor="middle">x ↦ 0</text><rect x="582.0" y="200.0" width="70.0" height="46.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="617.0" y="227.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2C4257" text-anchor="middle">y ↦ 1</text><rect x="686.0" y="200.0" width="64.0" height="46.0" rx="8" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.5"/><text x="718.0" y="227.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#8E3324" text-anchor="middle">z ↦ 0</text><rect x="760.0" y="200.0" width="64.0" height="46.0" rx="8" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.5"/><text x="792.0" y="227.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#8E3324" text-anchor="middle">w ↦ 1</text><text x="543.0" y="274.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#2C4257" text-anchor="middle">P</text><text x="718.0" y="274.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#BF4A32" text-anchor="middle">Q</text><text x="670.0" y="318.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#23272E" text-anchor="middle">h = h1 + h2</text><text x="670.0" y="344.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="middle">两半不相交，合起来才是整个堆</text><text x="670.0" y="378.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="middle">各说各的那一半，互不知道对方存在</text><rect x="40.0" y="424.0" width="820.0" height="62.0" rx="14" fill="#F6F1E7" stroke="#E4D9C6" stroke-width="1.2"/><text x="60.0" y="452.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15.524999999999999" font-weight="normal" fill="#2C4257" text-anchor="start">h ⊨ P ∧ Q</text><text x="176.0" y="452.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.524999999999999" font-weight="normal" fill="#23272E" text-anchor="start">iff  h ⊨ P 且 h ⊨ Q：同一个 h，两句话都说整个堆</text><text x="60.0" y="476.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15.524999999999999" font-weight="normal" fill="#BF4A32" text-anchor="start">h ⊨ P ∗ Q</text><text x="176.0" y="476.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.524999999999999" font-weight="normal" fill="#23272E" text-anchor="start">iff  h = h1 + h2，h1 ⊨ P，h2 ⊨ Q：各说各的那一半</text></svg>