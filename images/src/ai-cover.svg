<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 900 500" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3D5A80"/></marker></defs><rect width="900" height="500" fill="#FBF7F0"/><text x="60.0" y="54.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="700" fill="#3D5A80" text-anchor="start" letter-spacing="2.6">形式化笔记 · 程序分析</text><text x="60.0" y="168.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="64" font-weight="700" fill="#23272E" text-anchor="start">抽象解释</text><text x="60.0" y="238.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="42" font-weight="700" fill="#23272E" text-anchor="start">把无限装进格子</text><path d="M 60.0 266.0 L 330.0 266.0" fill="none" stroke="#3D5A80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60.0" y="302.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#7A7468" text-anchor="start">具体是集合，摘要是元素</text><text x="60.0" y="330.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#7A7468" text-anchor="start">健全性只向上，不向下</text><text x="60.0" y="358.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="normal" fill="#7A7468" text-anchor="start">widening 换终止，narrowing 换精度</text><text x="60.0" y="436.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="normal" fill="#7A7468" text-anchor="start">从 Galois 连接、抽象域到 widening</text><text x="60.0" y="462.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#7A7468" text-anchor="start">附一个一百多行、可运行的区间分析器</text><rect x="590.0" y="90.0" width="270.0" height="340.0" rx="18" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="725.0" y="120.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="normal" fill="#7A7468" text-anchor="middle">所有运行</text><circle cx="650.0" cy="178.0" r="4.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="682.0" cy="160.0" r="4.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="716.0" cy="172.0" r="4.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="748.0" cy="152.0" r="4.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="780.0" cy="176.0" r="4.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="806.0" cy="200.0" r="4.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="770.0" cy="212.0" r="4.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="730.0" cy="200.0" r="4.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="694.0" cy="204.0" r="4.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="660.0" cy="200.0" r="4.0" fill="#3D5A80" stroke="none" stroke-width="1"/><ellipse cx="730.0" cy="184.0" rx="94.0" ry="44.0" fill="none" stroke="#3D5A80" stroke-width="1.4" stroke-dasharray="6 5"/><path d="M 725.0 240.0 Q 725.0 266.0 725.0 292.0" fill="none" stroke="#3D5A80" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m0)"/><text x="740.0" y="268.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#3D5A80" text-anchor="start">α</text><path d="M 635.0 330.0 L 815.0 330.0" fill="none" stroke="#D8CFBF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 635.0 326.0 L 635.0 334.0" fill="none" stroke="#7A7468" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 680.0 326.0 L 680.0 334.0" fill="none" stroke="#7A7