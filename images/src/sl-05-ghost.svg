<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 900 540" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7468"/></marker></defs><rect width="900" height="540" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">05 · 幽灵状态</text><text x="40.0" y="82.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#23272E" text-anchor="start">资源不一定是格子</text><text x="40.0" y="114.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#7A7468" text-anchor="start">只要它能“相加”，就能被 own 起来</text><rect x="40.0" y="146.0" width="400.0" height="234.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="58.0" y="174.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="600" fill="#7A7468" text-anchor="start">资源代数：偏交换幺半群 + 有效性</text><rect x="68.0" y="196.0" width="62.0" height="44.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="99.0" y="223.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#2C4257" text-anchor="middle">a</text><text x="146.0" y="224.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#23272E" text-anchor="middle">·</text><rect x="164.0" y="196.0" width="62.0" height="44.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="195.0" y="223.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#2C4257" text-anchor="middle">b</text><path d="M 240.0 218.0 Q 258.0 218.0 276.0 218.0" fill="none" stroke="#7A7468" stroke-width="1.8" stroke-linecap="round" marker-end="url(#m0)"/><rect x="292.0" y="196.0" width="84.0" height="44.0" rx="8" fill="#FFFCF7" stroke="#2F7D6B" stroke-width="1.5"/><text x="334.0" y="223.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#2F7D6B" text-anchor="middle">a · b</text><text x="58.0" y="276.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="normal" fill="#2F7D6B" text-anchor="start">✓ a</text><text x="102.0" y="276.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">两半能不能同时存在？</text><text x="58.0" y="306.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="normal" fill="#23272E" text-anchor="start">own γ a ∗ own γ b  ⊣⊢  own γ (a · b)</text><text x="58.0" y="336.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">合并由 ⋅ 给出；有效性由 ✓ 检查。</text><text x="58.0" y="360.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">资源从不进堆，只随证明流动。</text><rect x="480.0" y="146.0" width="380.0" height="252.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="498.0" y="174.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="600" fill="#7A7468" text-anchor="start">四种常用的资源</text><rect x="496.0" y="192.0" width="348.0" height="36.0" rx="8" fill="#FFFCF7" stroke="#D8CFBF" stroke-width="1.1"/><text x="510.0" y="215.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="600" fill="#3D5A80" text-anchor="start">Auth ● / ◯</text><text x="612.0" y="215.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#23272E" text-anchor="start">权威一份、片段多份：协议</text><rect x="496.0" y="236.0" width="348.0" height="36.0" rx="8" fill="#FFFCF7" stroke="#D8CFBF" stroke-width="1.1"/><text x="510.0" y="259.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="600" fill="#2F7D6B" text-anchor="start">Frac q</text><text x="612.0" y="259.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#23272E" text-anchor="start">分数：读可复制，写唯一</text><rect x="496.0" y="280.0" width="348.0" height="36.0" rx="8" fill="#FFFCF7" stroke="#D8CFBF" stroke-width="1.1"/><text x="510.0" y="303.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="600" fill="#BF4A32" text-anchor="start">Excl</text><text x="612.0" y="303.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#23272E" text-anchor="start">独占：只能发一次</text><rect x="496.0" y="324.0" width="348.0" height="36.0" rx="8" fill="#FFFCF7" stroke="#D8CFBF" stroke-width="1.1"/><text x="510.0" y="347.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="600" fill="#D8A84E" text-anchor="start">Agree</text><text x="612.0" y="347.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#23272E" text-anchor="start">一致：所有副本必须相等</text><text x="498.0" y="386.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="12.649999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">都是 camera（CMRA）：带步进结构的资源代数</text><rect x="40.0" y="404.0" width="820.0" height="46.0" rx="14" fill="#F6F1E7" stroke="#E4D9C6" stroke-width="1.2"/><text x="60.0" y="433.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#23272E" text-anchor="start">own γ a：我持有资源 a（γ 是幽灵名）。它不在堆里，但和堆一样能被 ∗ 切分。</text></svg>