<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 900 630" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#BF4A32"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F7D6B"/></marker></defs><rect width="900" height="630" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">图 8 / HOMOTOPY &amp; FUNDAMENTAL GROUP</text><text x="40.0" y="78.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#23272E" text-anchor="start">同伦：允许形变之后，剩下的才是“形状”</text><text x="40.0" y="110.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17.5" font-weight="normal" fill="#7A7468" text-anchor="start">绕不过去的洞，被基本群记成一个整数</text><rect x="60.0" y="150.0" width="800.0" height="340.0" rx="18" fill="#F4EEE2" stroke="#E4D9C6" stroke-width="1"/><circle cx="400.0" cy="320.0" r="58.0" fill="#FBF7F0" stroke="#23272E" stroke-width="2.4"/><text x="400.0" y="326.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="normal" fill="#7A7468" text-anchor="middle">洞</text><circle cx="400.0" cy="320.0" r="118.0" fill="none" stroke="#BF4A32" stroke-width="2.8" stroke-dasharray="9 7"/><path d="M 506.3 268.7 Q 493.6 239.8 462.2 241.7" fill="none" stroke="#BF4A32" stroke-width="2.4" stroke-linecap="round" marker-end="url(#m0)"/><text x="268.0" y="314.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.524999999999999" font-weight="600" fill="#BF4A32" text-anchor="end">绕数 1</text><text x="268.0" y="336.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#BF4A32" text-anchor="end">怎样都缩不成一点</text><circle cx="700.0" cy="258.0" r="52.0" fill="none" stroke="#2F7D6B" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.25"/><circle cx="700.0" cy="258.0" r="36.0" fill="none" stroke="#2F7D6B" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.45"/><circle cx="700.0" cy="258.0" r="20.0" fill="none" stroke="#2F7D6B" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><circle cx="700.0" cy="258.0" r="5.0" fill="#2F7D6B" stroke="#2F7D6B" stroke-width="1"/><path d="M 770.0 304.0 Q 747.0 290.0 724.0 276.0" fill="none" stroke="#2F7D6B" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 5" marker-end="url(#m1)"/><text x="700.0" y="336.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#2F7D6B" text-anchor="middle">绕数 0：缩成一点</text><text x="92.0" y="192.0" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="14.95" font-weight="normal" fill="#7A7468" text-anchor="start">平面 ℝ²</text><text x="40.0" y="534.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.5" font-weight="normal" fill="#23272E" text-anchor="start">π₁(ℝ² ∖ {0}) ≅ ℤ：每个环落在一个整数上，连续形变不改变它。</text><text x="40.0" y="566.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.524999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">而 π₁(ℝ²) = 0。于是“挖了一个点的平面”与“平面”不同胚 —— 尽管两者都连通、都不可数。</text><text x="40.0" y="598.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.524999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">同伦比同胚粗：它允许把距离、角度、甚至把整个空间压扁，只留下“洞”的信息。</text></svg>