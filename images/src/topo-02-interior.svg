<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 900 560" text-rendering="geometricPrecision"><defs></defs><rect width="900" height="560" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">图 2 / INTERIOR, FRONTIER, EXTERIOR</text><text x="40.0" y="78.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#23272E" text-anchor="start">三种点：已确认、说不清、已否定</text><text x="40.0" y="110.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17.5" font-weight="normal" fill="#7A7468" text-anchor="start">内部、边界、外部 —— 看它有没有一个“整个落在里面”的开邻域</text><ellipse cx="300.0" cy="340.0" rx="196.0" ry="146.0" fill="#2F7D6B" stroke="#2F7D6B" stroke-width="2" opacity="0.07"/><ellipse cx="300.0" cy="340.0" rx="196.0" ry="146.0" fill="none" stroke="#2F7D6B" stroke-width="2.2"/><text x="300.0" y="268.0" font-family="Songti SC, STSong, Noto Serif CJK SC, serif" font-size="32" font-weight="700" fill="#2F7D6B" text-anchor="middle">S</text><circle cx="232.0" cy="312.0" r="34.0" fill="none" stroke="#2F7D6B" stroke-width="1.2" stroke-dasharray="4 5"/><circle cx="232.0" cy="312.0" r="7.0" fill="#2F7D6B" stroke="#FBF7F0" stroke-width="1.6"/><text x="276.0" y="318.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="#2F7D6B" text-anchor="start">已确认</text><circle cx="467.1" cy="416.3" r="34.0" fill="none" stroke="#D8A84E" stroke-width="1.2" stroke-dasharray="4 5"/><circle cx="467.1" cy="416.3" r="7.0" fill="#D8A84E" stroke="#FBF7F0" stroke-width="1.6"/><text x="467.1" y="474.3" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="#D8A84E" text-anchor="middle">说不清</text><text x="467.1" y="498.3" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="normal" fill="#7A7468" text-anchor="middle">点在边界上</text><circle cx="548.0" cy="228.0" r="34.0" fill="none" stroke="#7A7468" stroke-width="1.2" stroke-dasharray="4 5"/><circle cx="548.0" cy="228.0" r="7.0" fill="#7A7468" stroke="#FBF7F0" stroke-width="1.6"/><text x="548.0" y="184.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="#7A7468" text-anchor="middle">已否定</text><rect x="622.0" y="158.0" width="238.0" height="102.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><rect x="622.0" y="158.0" width="5.0" height="102.0" rx="2" fill="#2F7D6B" stroke="none" stroke-width="1"/><text x="640.0" y="187.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#2F7D6B" text-anchor="start">内部</text><text x="844.0" y="187.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.374999999999998" font-weight="normal" fill="#7A7468" text-anchor="end">int S</text><text x="640.0" y="213.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.489999999999998" font-weight="normal" fill="#23272E" text-anchor="start">有一个开邻域整个落在 S 里：</text><text x="640.0" y="234.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.489999999999998" font-weight="normal" fill="#23272E" text-anchor="start">S 已经被确认。</text><rect x="622.0" y="276.0" width="238.0" height="102.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><rect x="622.0" y="276.0" width="5.0" height="102.0" rx="2" fill="#D8A84E" stroke="none" stroke-width="1"/><text x="640.0" y="305.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#D8A84E" text-anchor="start">边界</text><text x="844.0" y="305.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.374999999999998" font-weight="normal" fill="#7A7468" text-anchor="end">∂S</text><text x="640.0" y="331.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.489999999999998" font-weight="normal" fill="#23272E" text-anchor="start">每个开邻域都同时碰到 S 和它的补集：</text><text x="640.0" y="352.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.489999999999998" font-weight="normal" fill="#23272E" text-anchor="start">既没确认，也没否定。</text><rect x="622.0" y="394.0" width="238.0" height="102.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><rect x="622.0" y="394.0" width="5.0" height="102.0" rx="2" fill="#7A7468" stroke="none" stroke-width="1"/><text x="640.0" y="423.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#7A7468" text-anchor="start">外部</text><text x="844.0" y="423.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.374999999999998" font-weight="normal" fill="#7A7468" text-anchor="end">int Sᶜ</text><text x="640.0" y="449.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.489999999999998" font-weight="normal" fill="#23272E" text-anchor="start">有一个开邻域完全避开 S：</text><text x="640.0" y="470.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.489999999999998" font-weight="normal" fill="#23272E" text-anchor="start">¬S 已经被确认。</text><text x="40.0" y="534.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="normal" fill="#23272E" text-anchor="start">X = int S ∪ ∂S ∪ int Sᶜ，三类点互不重叠 —— 每个点恰好属于一类。</text></svg>