<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 900 560" text-rendering="geometricPrecision"><defs><marker id="m0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7468"/></marker><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7468"/></marker></defs><rect width="900" height="560" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">04 · 并发</text><text x="40.0" y="82.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#23272E" text-anchor="start">不相交，就不相扰</text><text x="40.0" y="114.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#7A7468" text-anchor="start">两条规格各管一半堆，合起来就是并行</text><rect x="40.0" y="146.0" width="390.0" height="216.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="58.0" y="174.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="700" fill="#2F7D6B" text-anchor="start" letter-spacing="1.6">互不相交</text><rect x="66.0" y="196.0" width="66.0" height="44.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="99.0" y="222.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2C4257" text-anchor="middle">x ↦ _</text><rect x="158.0" y="196.0" width="66.0" height="44.0" rx="8" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.5"/><text x="191.0" y="222.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2C4257" text-anchor="middle">y ↦ _</text><path d="M 99.0 256.0 Q 99.0 272.0 99.0 288.0" fill="none" stroke="#7A7468" stroke-width="1.6" stroke-linecap="round" marker-end="url(#m0)"/><path d="M 191.0 256.0 Q 191.0 272.0 191.0 288.0" fill="none" stroke="#7A7468" stroke-width="1.6" stroke-linecap="round" marker-end="url(#m1)"/><text x="133.0" y="316.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="middle">各写各的格子，任何交错都一样</text><text x="58.0" y="346.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.649999999999999" font-weight="normal" fill="#2F7D6B" text-anchor="start">P1 ∗ P2 可满足：两半真的能拼起来</text><rect x="470.0" y="146.0" width="390.0" height="216.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="488.0" y="174.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="700" fill="#BF4A32" text-anchor="start" letter-spacing="1.6">同一格，两份所有权</text><rect x="496.0" y="196.0" width="66.0" height="44.0" rx="8" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.5"/><text x="529.0" y="222.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#8E3324" text-anchor="middle">x ↦ _</text><rect x="580.0" y="196.0" width="66.0" height="44.0" rx="8" fill="#EFE7D8" stroke="#BF4A32" stroke-width="1.5"/><text x="613.0" y="222.3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#8E3324" text-anchor="middle">x ↦ _</text><path d="M 506.0 202.0 L 636.0 236.0" fill="none" stroke="#8E3324" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 636.0 202.0 L 506.0 236.0" fill="none" stroke="#8E3324" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="672.0" y="212.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="normal" fill="#BF4A32" text-anchor="start">x ↦ _  ∗  x ↦ _</text><text x="672.0" y="236.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.799999999999999" font-weight="700" fill="#8E3324" text-anchor="start">不可满足</text><text x="665.0" y="316.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="middle">竞态不是“要小心”，是前提本身就假</text><text x="488.0" y="346.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12.649999999999999" font-weight="normal" fill="#8E3324" text-anchor="start">通过验证的程序不可能有数据竞争</text><rect x="40.0" y="396.0" width="820.0" height="132.0" rx="14" fill="#F6F1E7" stroke="#E4D9C6" stroke-width="1.2"/><text x="66.0" y="428.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#23272E" text-anchor="start">{P1} c1 {Q1}</text><text x="300.0" y="428.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#23272E" text-anchor="start">{P2} c2 {Q2}</text><path d="M 66.0 446.0 L 462.0 446.0" fill="none" stroke="#23272E" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="66.0" y="478.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="normal" fill="#BF4A32" text-anchor="start">{P1 ∗ P2}  c1 ∥ c2  {Q1 ∗ Q2}</text><text x="500.0" y="424.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">两条线程的 footprint 互不相交，</text><text x="500.0" y="448.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">各自独立验证就够了。</text><text x="500.0" y="476.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">交错不必枚举：没有一条能碰到对方。</text></svg>