<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 900 600" text-rendering="geometricPrecision"><defs></defs><rect width="900" height="600" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">图 3 / THE LATTICE OF OPENS</text><text x="40.0" y="78.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#23272E" text-anchor="start">开集是幂集里的哪些元素</text><text x="40.0" y="110.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17.5" font-weight="normal" fill="#7A7468" text-anchor="start">同样四个子集，拓扑不同，亮着的节点就不同；灰掉的是不可确认的性质</text><rect x="40.0" y="140.0" width="390.0" height="380.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="64.0" y="172.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#2F7D6B" text-anchor="start">Sierpiński 空间</text><text x="64.0" y="194.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#7A7468" text-anchor="start">点：0、1；开集：∅、{1}、{0,1}</text><path d="M 219.6 265.7 L 162.4 324.3" fill="none" stroke="#D8CFBF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M 250.4 265.7 L 307.6 324.3" fill="none" stroke="#2F7D6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 162.4 355.7 L 219.6 414.3" fill="none" stroke="#D8CFBF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M 307.6 355.7 L 250.4 414.3" fill="none" stroke="#2F7D6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="201.0" y="234.0" width="68.0" height="32.0" rx="8" fill="#E8F0EC" stroke="#2F7D6B" stroke-width="1.8"/><text x="235.0" y="254.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2F7D6B" text-anchor="middle">{0,1}</text><rect x="113.0" y="324.0" width="68.0" height="32.0" rx="8" fill="#FBF7F0" stroke="#D8CFBF" stroke-width="1.4" stroke-dasharray="4 5"/><text x="147.0" y="344.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#7A7468" text-anchor="middle">{0}</text><rect x="289.0" y="324.0" width="68.0" height="32.0" rx="8" fill="#E8F0EC" stroke="#2F7D6B" stroke-width="1.8"/><text x="323.0" y="344.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2F7D6B" text-anchor="middle">{1}</text><rect x="201.0" y="414.0" width="68.0" height="32.0" rx="8" fill="#E8F0EC" stroke="#2F7D6B" stroke-width="1.8"/><text x="235.0" y="434.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2F7D6B" text-anchor="middle">∅</text><text x="64.0" y="480.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.57" font-weight="normal" fill="#BF4A32" text-anchor="start">¬{1} = ∅，¬¬{1} = {0,1}</text><rect x="470.0" y="140.0" width="390.0" height="380.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="494.0" y="172.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#2F7D6B" text-anchor="start">两点离散空间</text><text x="494.0" y="194.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#7A7468" text-anchor="start">点：a、b；开集：全部四个子集</text><path d="M 649.6 265.7 L 592.4 324.3" fill="none" stroke="#2F7D6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 680.4 265.7 L 737.6 324.3" fill="none" stroke="#2F7D6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 592.4 355.7 L 649.6 414.3" fill="none" stroke="#2F7D6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 737.6 355.7 L 680.4 414.3" fill="none" stroke="#2F7D6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="631.0" y="234.0" width="68.0" height="32.0" rx="8" fill="#E8F0EC" stroke="#2F7D6B" stroke-width="1.8"/><text x="665.0" y="254.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2F7D6B" text-anchor="middle">{a,b}</text><rect x="543.0" y="324.0" width="68.0" height="32.0" rx="8" fill="#E8F0EC" stroke="#2F7D6B" stroke-width="1.8"/><text x="577.0" y="344.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2F7D6B" text-anchor="middle">{a}</text><rect x="719.0" y="324.0" width="68.0" height="32.0" rx="8" fill="#E8F0EC" stroke="#2F7D6B" stroke-width="1.8"/><text x="753.0" y="344.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2F7D6B" text-anchor="middle">{b}</text><rect x="631.0" y="414.0" width="68.0" height="32.0" rx="8" fill="#E8F0EC" stroke="#2F7D6B" stroke-width="1.8"/><text x="665.0" y="434.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="600" fill="#2F7D6B" text-anchor="middle">∅</text><text x="494.0" y="480.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.57" font-weight="normal" fill="#2F7D6B" text-anchor="start">¬{a} = {b}，排中律成立</text><text x="40.0" y="550.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.179999999999998" font-weight="normal" fill="#23272E" text-anchor="start">左边不是布尔代数：{1} ∪ ¬{1} = {1}，少了 {0}。右边是：每个元素都有补集。</text><text x="40.0" y="576.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.179999999999998" font-weight="normal" fill="#7A7468" text-anchor="start">同一个四点格，左边只亮了三个节点，连成一条链；右边四个全亮，连成菱形。</text></svg>