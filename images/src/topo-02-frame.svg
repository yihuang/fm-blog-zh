<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 900 540" text-rendering="geometricPrecision"><defs></defs><rect width="900" height="540" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">图 3 / THE LATTICE OF OPENS</text><text x="40.0" y="78.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#23272E" text-anchor="start">开集的格：真值不止两个</text><text x="40.0" y="110.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17.5" font-weight="normal" fill="#7A7468" text-anchor="start">同一个空间的开集按包含排成格；否定是否等于补集，决定了逻辑是不是布尔的</text><rect x="40.0" y="140.0" width="390.0" height="320.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="64.0" y="172.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#2F7D6B" text-anchor="start">Sierpiński 空间</text><text x="64.0" y="194.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#7A7468" text-anchor="start">开集：∅、{1}、{0,1}</text><path d="M 200.0 270.0 L 200.0 300.0" fill="none" stroke="#23272E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200.0" cy="240.0" r="29.0" fill="#FBF7F0" stroke="#23272E" stroke-width="2"/><text x="200.0" y="245.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#23272E" text-anchor="middle">X</text><path d="M 200.0 360.0 L 200.0 390.0" fill="none" stroke="#23272E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200.0" cy="330.0" r="29.0" fill="#FBF7F0" stroke="#23272E" stroke-width="2"/><text x="200.0" y="335.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#23272E" text-anchor="middle">P</text><circle cx="200.0" cy="420.0" r="29.0" fill="#FBF7F0" stroke="#23272E" stroke-width="2"/><text x="200.0" y="425.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#23272E" text-anchor="middle">∅</text><text x="246.0" y="246.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">= {0,1}</text><text x="246.0" y="336.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">= {1}</text><rect x="470.0" y="140.0" width="390.0" height="320.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="494.0" y="172.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#5B7083" text-anchor="start">两点离散空间</text><text x="494.0" y="194.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.374999999999998" font-weight="normal" fill="#7A7468" text-anchor="start">开集：∅、{a}、{b}、{a,b}</text><path d="M 645.8 398.3 L 609.2 356.7" fill="none" stroke="#23272E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 684.2 398.3 L 720.8 356.7" fill="none" stroke="#23272E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 608.0 312.2 L 647.0 262.8" fill="none" stroke="#23272E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 722.0 312.2 L 683.0 262.8" fill="none" stroke="#23272E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="665.0" cy="240.0" r="29.0" fill="#FBF7F0" stroke="#23272E" stroke-width="2"/><text x="665.0" y="245.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#23272E" text-anchor="middle">X</text><circle cx="590.0" cy="335.0" r="29.0" fill="#FBF7F0" stroke="#23272E" stroke-width="2"/><text x="590.0" y="340.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#23272E" text-anchor="middle">{a}</text><circle cx="740.0" cy="335.0" r="29.0" fill="#FBF7F0" stroke="#23272E" stroke-width="2"/><text x="740.0" y="340.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#23272E" text-anchor="middle">{b}</text><circle cx="665.0" cy="420.0" r="29.0" fill="#FBF7F0" stroke="#23272E" stroke-width="2"/><text x="665.0" y="425.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14.95" font-weight="600" fill="#23272E" text-anchor="middle">∅</text><text x="40.0" y="502.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.524999999999999" font-weight="normal" fill="#23272E" text-anchor="start">左边不是布尔代数：P 既不是 ⊥ 也不是 ⊤，¬P = ⊥，¬¬P = ⊤。</text><text x="40.0" y="526.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.524999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">右边是：每个元素都有补集。开集的逻辑一般更接近左边 —— 边界就是那个“说不清”的中间值。</text></svg>