<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 900 620" text-rendering="geometricPrecision"><defs></defs><rect width="900" height="620" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">图 5 / COMPACTNESS</text><text x="40.0" y="78.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" fill="#23272E" text-anchor="start">紧致：任何开覆盖，都能抽出有限个</text><text x="40.0" y="110.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="17.5" font-weight="normal" fill="#7A7468" text-anchor="start">局部信息足够多时，紧致性保证只用有限多条就能覆盖全局</text><rect x="30.0" y="140.0" width="400.0" height="330.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="54.0" y="176.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#2F7D6B" text-anchor="start">紧致</text><text x="54.0" y="200.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="normal" fill="#7A7468" text-anchor="start">[0, 1]：有有限子覆盖</text><path d="M 62.0 390.0 L 398.0 390.0" fill="none" stroke="#23272E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="62.0" cy="390.0" r="4.0" fill="#23272E" stroke="#23272E" stroke-width="1"/><circle cx="398.0" cy="390.0" r="4.0" fill="#23272E" stroke="#23272E" stroke-width="1"/><path d="M 62.0 390.0 Q 106.0 324.0 150.0 390.0" fill="none" stroke="#2F7D6B" stroke-width="2.4" stroke-linecap="round"/><path d="M 128.0 390.0 Q 173.0 317.0 218.0 390.0" fill="none" stroke="#2F7D6B" stroke-width="2.4" stroke-linecap="round"/><path d="M 196.0 390.0 Q 241.0 310.0 286.0 390.0" fill="none" stroke="#2F7D6B" stroke-width="2.4" stroke-linecap="round"/><path d="M 264.0 390.0 Q 308.0 303.0 352.0 390.0" fill="none" stroke="#2F7D6B" stroke-width="2.4" stroke-linecap="round"/><path d="M 330.0 390.0 Q 364.0 296.0 398.0 390.0" fill="none" stroke="#2F7D6B" stroke-width="2.4" stroke-linecap="round"/><text x="54.0" y="448.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.029999999999998" font-weight="normal" fill="#7A7468" text-anchor="start">这 5 个开集就盖住了整条线段：[0,1] 是紧致的。</text><rect x="470.0" y="140.0" width="400.0" height="330.0" rx="16" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="494.0" y="176.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#BF4A32" text-anchor="start">不紧致</text><text x="494.0" y="200.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="normal" fill="#7A7468" text-anchor="start">(0, 1)：没有有限子覆盖</text><path d="M 500.0 390.0 L 850.0 390.0" fill="none" stroke="#23272E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><circle cx="500.0" cy="390.0" r="4.0" fill="#FBF7F0" stroke="#23272E" stroke-width="1.6"/><circle cx="850.0" cy="390.0" r="4.0" fill="#FBF7F0" stroke="#23272E" stroke-width="1.6"/><path d="M 502.0 390.0 Q 588.0 350.0 674.0 390.0" fill="none" stroke="#BF4A32" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/><path d="M 502.0 390.0 Q 617.0 336.0 732.0 390.0" fill="none" stroke="#BF4A32" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/><path d="M 502.0 390.0 Q 631.5 322.0 761.0 390.0" fill="none" stroke="#BF4A32" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/><path d="M 502.0 390.0 Q 646.0 308.0 790.0 390.0" fill="none" stroke="#BF4A32" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/><path d="M 502.0 390.0 Q 674.0 294.0 846.0 390.0" fill="none" stroke="#BF4A32" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.5"/><text x="500.0" y="444.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.26" font-weight="normal" fill="#7A7468" text-anchor="start">U_n = (0, 1−1/n)：每个都差一点到 1；</text><text x="500.0" y="466.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.26" font-weight="normal" fill="#7A7468" text-anchor="start">有限个里最长的那个，还是差一点。</text><text x="852.0" y="368.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="normal" fill="#7A7468" text-anchor="middle">1</text><text x="500.0" y="414.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.799999999999999" font-weight="normal" fill="#7A7468" text-anchor="middle">0</text><text x="40.0" y="528.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="normal" fill="#23272E" text-anchor="start">把“每个点附近都成立”升级成“整块上一致成立”，代价是：只付得起有限张证书。</text><text x="40.0" y="558.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.524999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">紧致性就是这张“有限证书”存在性的保证。Heine–Borel：ℝⁿ 里，紧致 ⟺ 有界且闭。</text><text x="40.0" y="588.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="15.524999999999999" font-weight="normal" fill="#7A7468" text-anchor="start">反例：(0,1) 有界但不闭；ℚ ∩ [0,1] 有界且闭，但在 ℝ 里不紧致 —— 因为 ℚ 有洞。</text></svg>