<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 900 530" text-rendering="geometricPrecision"><defs></defs><rect width="900" height="530" fill="#FBF7F0"/><text x="40.0" y="38.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="600" fill="#7A7468" text-anchor="start" letter-spacing="2.4">07 · 选择</text><text x="40.0" y="82.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#23272E" text-anchor="start">精度是形状问题</text><text x="40.0" y="114.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="16.5" font-weight="normal" fill="#7A7468" text-anchor="start">状态集合长什么样，决定哪个域够用</text><rect x="40.0" y="150.0" width="190.0" height="280.0" rx="14" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="56.0" y="178.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="700" fill="#23272E" text-anchor="start">区间</text><text x="56.0" y="200.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">轴对齐的盒子</text><text x="56.0" y="402.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">成本：低</text><path d="M 70.0 330.0 L 210.0 330.0" fill="none" stroke="#D8CFBF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 70.0 330.0 L 70.0 230.0" fill="none" stroke="#D8CFBF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="250.0" y="150.0" width="190.0" height="280.0" rx="14" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="266.0" y="178.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="700" fill="#23272E" text-anchor="start">八边形</text><text x="266.0" y="200.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">±x ±y ≤ c</text><text x="266.0" y="402.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">成本：中</text><path d="M 280.0 330.0 L 420.0 330.0" fill="none" stroke="#D8CFBF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 280.0 330.0 L 280.0 230.0" fill="none" stroke="#D8CFBF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="460.0" y="150.0" width="190.0" height="280.0" rx="14" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="476.0" y="178.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="700" fill="#23272E" text-anchor="start">多面体</text><text x="476.0" y="200.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">任意线性不等式</text><text x="476.0" y="402.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">成本：高</text><path d="M 490.0 330.0 L 630.0 330.0" fill="none" stroke="#D8CFBF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 490.0 330.0 L 490.0 230.0" fill="none" stroke="#D8CFBF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="670.0" y="150.0" width="190.0" height="280.0" rx="14" fill="#FFFCF7" stroke="#E8DFCF" stroke-width="1.2"/><text x="686.0" y="178.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.5" font-weight="700" fill="#23272E" text-anchor="start">路径敏感</text><text x="686.0" y="200.0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">有限个盒子的并</text><text x="686.0" y="402.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13.225" font-weight="normal" fill="#7A7468" text-anchor="start">成本：随路径数</text><path d="M 700.0 330.0 L 840.0 330.0" fill="none" stroke="#D8CFBF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 700.0 330.0 L 700.0 230.0" fill="none" stroke="#D8CFBF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="60.0" y="250.0" width="100.0" height="60.0" rx="0" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.8"/><circle cx="80.0" cy="300.0" r="3.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="120.0" cy="280.0" r="3.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="150.0" cy="262.0" r="3.0" fill="#3D5A80" stroke="none" stroke-width="1"/><path d="M 393.0 309.9 L 364.9 338.0 L 325.1 338.0 L 297.0 309.9 L 297.0 270.1 L 325.1 242.0 L 364.9 242.0 L 393.0 270.1 Z" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="325.0" cy="310.0" r="3.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="350.0" cy="300.0" r="3.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="365.0" cy="282.0" r="3.0" fill="#3D5A80" stroke="none" stroke-width="1"/><path d="M 500.0 320.0 L 590.0 320.0 L 620.0 250.0 Z" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="530.0" cy="305.0" r="3.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="565.0" cy="295.0" r="3.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="590.0" cy="280.0" r="3.0" fill="#3D5A80" stroke="none" stroke-width="1"/><rect x="700.0" y="250.0" width="60.0" height="60.0" rx="0" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.6"/><rect x="790.0" y="270.0" width="50.0" height="60.0" rx="0" fill="#E9F0F6" stroke="#3D5A80" stroke-width="1.6"/><circle cx="720.0" cy="300.0" r="3.0" fill="#3D5A80" stroke="none" stroke-width="1"/><circle cx="815.0" cy="290.0" r="3.0" fill="#3D5A80" stroke="none" stroke-width="1"/><text x="40.0" y="470.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="normal" fill="#23272E" text-anchor="start">区间只能画一个盒子；八边形能把角切掉；多面体更贴合；路径敏感干脆画两个盒子。</text><text x="40.0" y="496.0" font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="14.95" font-weight="normal" fill="#7A7468" text-anchor="start">每多一种形状，转移函数就多一份工作量——这就是精度的价格。</text></svg>